version: '3.8'

services:
  cloudquiz-web:
    # Para deploy via Registro de Contêineres (GHCR) no Portainer, substitua pelo caminho da sua imagem:
    # image: ghcr.io/seu-usuario/cloudquiz-baas:latest
    image: ${DOCKER_IMAGE:-ghcr.io/unifor-cloud/cloudquiz-baas:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACK4APP_APP_ID: ${VITE_BACK4APP_APP_ID:-}
        VITE_BACK4APP_JS_KEY: ${VITE_BACK4APP_JS_KEY:-}
        VITE_BACK4APP_SERVER_URL: ${VITE_BACK4APP_SERVER_URL:-https://parseapi.back4app.com}
        VITE_BACK4APP_LIVEQUERY_URL: ${VITE_BACK4APP_LIVEQUERY_URL:-}
    container_name: cloudquiz-arena
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
