server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para entrega rápida na VPS Oracle Cloud
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Endpoint de verificação de integridade para o Portainer / Docker Healthcheck
    location /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Cache longo para bundles estáticos com hash gerados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Roteamento SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
