name: CI - Testes e Build (deploy automático pela Vercel)

# O deploy é feito pela integração GitHub <-> Vercel:
#  - push na main  -> deploy de PRODUÇÃO
#  - pull request  -> deploy de PREVIEW (URL própria comentada no PR)
# Este workflow garante que testes e build passam antes do merge.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-and-build:
    name: Vitest + Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Testes funcionais (Vitest)
        run: npm test

      - name: Build de produção (Vite)
        run: npm run build
